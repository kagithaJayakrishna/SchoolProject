{% extends 'layout.html' %}

{% block title %}Login{% endblock title %}

{% block extra_css %}
    <style>
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
            padding: 20px;
        }

        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: min(100%, 360px);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555555;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .login-btn {
            width: 80px;
            height: 30px;
            background-color: #007bff;
            border: unset;
            border-radius: 5px;
            color: rgb(11, 0, 0);
            font-weight: 700;
            margin-top: 5px;
            transition: ease-in 1000ms;
            text-decoration: none;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #0056b3;
            color: rgb(32, 2, 2);
            transition: ease-out 1000ms;
        }
    </style>
{% endblock extra_css %}

{% block content %}
    <div class="login-page">
        <div class="login-container">
            <h2>Login</h2>
            <form>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="button-group">
                    <button class="login-btn">Login</button>
                </div>
            </form>
        </div>
    </div>

{% endblock content %}
